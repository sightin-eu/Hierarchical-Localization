[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Static metadata so resolvers (uv/pixi) read it without building the package.
[project]
name = "hloc"
# Keep in sync with `hloc.__version__`.
version = "1.5"
description = "Tools and baselines for visual localization and mapping"
readme = "README.md"
requires-python = ">=3.6"
authors = [{ name = "Paul-Edouard Sarlin" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=1.1",
    "torchvision>=0.3",
    "numpy",
    "opencv-python",
    "tqdm>=4.36.0",
    "matplotlib",
    "plotly",
    "scipy",
    "h5py",
    "pycolmap>=3.13.0",
    "kornia>=0.6.11",
    "gdown",
    "lightglue @ git+https://github.com/sightin-eu/LightGlue",
]

[project.urls]
Repository = "https://github.com/cvg/Hierarchical-Localization/"

[tool.setuptools.packages.find]
include = ["hloc*"]
